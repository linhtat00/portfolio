    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      // Single Page Apps for GitHub Pages: decode path redirected by 404.html
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');

          // Extract clean path segment without query or hash
          var rawPath = decodeURIComponent(decoded).replace(/^\//, '').toLowerCase().split('?')[0].split('#')[0].trim();
          
          // Whitelist of valid routes
          var isValid = rawPath === '' || 
                        rawPath === 'about' || 
                        rawPath === 'writeups' || 
                        rawPath === 'labs' || 
                        rawPath === 'homelab' || 
                        rawPath.startsWith('writeup/') || 
                        rawPath.startsWith('writeups/') || 
                        rawPath.startsWith('lab/') || 
                        rawPath.startsWith('labs/');

          var base = l.pathname.slice(0, -1) || '/';
          if (isValid) {
            window.history.replaceState(null, null, base + decoded + l.hash);
          } else {
            // Invalid route: immediately reset URL bar to clean homepage!
            var homeUrl = base + (base.endsWith('/') ? '' : '/');
            window.history.replaceState(null, null, homeUrl);
          }
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-[#0c0c0e] text-[#f4f4f5] antialiased selection:bg-[#fbbf24] selection:text-[#0c0c0e]">

  </body>
